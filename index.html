<style>
/* ============================================================
   EVEREST ARENA — DESIGN TOKENS

   ============================================================ */

:root{

  --bg-alt:#EFE8D8;
  --surface:#FFFFFF;
  --surface-2:#F3EEE1;

  --primary-deep:#153F6B;
  --primary-tint:#E6EFF9;
  --primary-tint-2:#D2E3F5;
  --gold:#A9832E;
  --gold-2:#C6A24C;
  --gold-tint:#F4EDD9;
  --success:#2E8B57;
  --success-tint:#E3F3EA;
  --danger:#C0483D;

    --success:#4FBE85;

    --danger:#E37D71;

:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11151E;
  --bg-alt:#161B25;
  --surface:#1B212C;

  --ink-soft:#A7AFBE;

  --primary-tint-2:#213A54;

  --gold-2:#E4C87C;

  --success:#4FBE85;
  --success-tint:#16302280;

*,*::before,*::after{ box-sizing:border-box; }
html{
  -webkit-text-size-adjust:100%;

  height:100%;
}
html,body{ overscroll-behavior-y: none; }
body{

  height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;

}
button,input,select,textarea{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }
button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
img{ max-width:100%; display:block; }
::selection{ background:var(--primary-tint-2); }

h1,h2,h3,h4{ font-family:var(--font-display); margin:0; letter-spacing:-0.01em; }
p{ margin:0; }

#app{ min-height:100%; position:relative; }

.tabular{ font-variant-numeric: tabular-nums; }

/* ---------- scrollbars for wide content ---------- */
.x-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.x-scroll::-webkit-scrollbar{ height:6px; }
.x-scroll::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }

/* ============================================================
   ANIMATION LIBRARY
   ============================================================ */
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes fadeScale{ from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);} }
@keyframes slideUpSheet{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
@keyframes slideDownOut{ from{ transform:translateY(0);} to{ transform:translateY(100%);} }
@keyframes ringPulse{
  0%{ box-shadow:0 0 0 0 rgba(30,95,160,.35); }
  70%{ box-shadow:0 0 0 18px rgba(30,95,160,0); }
  100%{ box-shadow:0 0 0 0 rgba(30,95,160,0); }
}
@keyframes livePulseDot{
  0%,100%{ opacity:1; } 50%{ opacity:.35; }
}
@keyframes shimmer{
  0%{ background-position:-200% 0; }
  100%{ background-position:200% 0; }
}
@keyframes splashLogoIn{
  0%{ opacity:0; filter:blur(10px); transform:scale(.9); }
  55%{ opacity:1; filter:blur(0); transform:scale(1.05); }
  100%{ transform:scale(1); }
}
@keyframes splashTextIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes dotBounce{
  0%,80%,100%{ transform:scale(.6); opacity:.4; }
  40%{ transform:scale(1); opacity:1; }
}
@keyframes toastIn{ from{ opacity:0; transform:translate(-50%,-10px);} to{ opacity:1; transform:translate(-50%,0);} }
@keyframes contourDrift{
  from{ transform:translate(0,0); } to{ transform:translate(-40px,-24px); }
}

/* no transform here: this div wraps every page's fixed bottom nav. A transform
   on an ancestor creates a new containing block for position:fixed children,
   pinning the nav to the bottom of THIS div instead of the viewport — that's
   the "nav only shows after scrolling to the end" bug. Opacity-only is safe. */
.view-enter{ animation:fadeIn .28s ease both; }
.modal-sheet-enter{ animation:slideUpSheet .32s cubic-bezier(.22,.61,.36,1) both; }
.modal-sheet-exit{ animation:slideDownOut .22s cubic-bezier(.4,0,1,1) both; }
.fade-enter{ animation:fadeIn .22s ease both; }
.press{ transition:transform .12s ease; }
.press:active{ transform:scale(.96); }
.press-card:active{ transform:scale(.985); }
.press-card{ transition:transform .15s cubic-bezier(.22,.61,.36,1), box-shadow .15s ease; }

.skeleton{
  background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
  border-radius:var(--radius-sm);
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
/* ============================================================
   EVEREST ARENA — COMPONENTS
   ============================================================ */

.icon{ width:22px; height:22px; flex-shrink:0; }
.icon-sm{ width:17px; height:17px; }
.icon-lg{ width:28px; height:28px; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; cursor:pointer; font-weight:600; font-size:14.5px;
  border-radius:14px; padding:14px 20px; line-height:1;
  font-family:var(--font-body);
}
.btn-primary{ background:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(30,95,160,.28); }
.btn-primary:active{ background:var(--primary-deep); }
.btn-secondary{ background:var(--primary-tint); color:var(--primary-deep); }
.btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line-strong); }
.btn-outline{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
.btn-danger{ background:var(--danger-tint); color:var(--danger); }
.btn-gold{ background:var(--gold); color:#fff; box-shadow:0 6px 16px rgba(169,131,46,.28); }
.btn-block{ width:100%; }
.btn-sm{ padding:9px 14px; font-size:13px; border-radius:11px; }
.btn:disabled{ opacity:.45; pointer-events:none; }
.btn-icon{
  width:40px; height:40px; border-radius:50%; padding:0;
  background:var(--surface-2); color:var(--ink);
}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border-radius:var(--radius-md);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.card-pad{ padding:18px; }

/* ---------- Chips / Segmented ---------- */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:100px; font-size:13px; font-weight:600;
  background:var(--surface-2); color:var(--ink-soft); border:1px solid transparent;
  cursor:pointer; white-space:nowrap;
}
.chip.active{ background:var(--primary); color:#fff; }
.chip-outline{ background:transparent; border:1.5px solid var(--line-strong); color:var(--ink); }
.chip-outline.active{ background:var(--primary-tint); border-color:var(--primary); color:var(--primary-deep); }

/* ---------- Status badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; letter-spacing:.02em;
  padding:5px 10px; border-radius:8px; line-height:1;
}
.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.badge-live{ background:var(--danger-tint); color:var(--danger); }
.badge-live .badge-dot{ animation:livePulseDot 1.1s ease-in-out infinite; }
.badge-upcoming{ background:var(--primary-tint); color:var(--primary-deep); }
.badge-full{ background:var(--warning-tint); color:var(--warning); }
.badge-completed{ background:var(--success-tint); color:var(--success); }
.badge-cancelled{ background:var(--surface-2); color:var(--ink-faint); }
.badge-pending{ background:var(--gold-tint); color:var(--gold); }
.badge-disputed{ background:var(--danger-tint); color:var(--danger); }
.badge-verified{ background:var(--success-tint); color:var(--success); }

/* ---------- Inputs ---------- */
.field{ display:flex; flex-direction:column; gap:7px; }
.field label{ font-size:13px; font-weight:600; color:var(--ink-soft); }
.input, .select{
  width:100%; border:1.5px solid var(--line-strong); background:var(--surface);
  border-radius:13px; padding:13px 14px; font-size:15px; color:var(--ink);
  outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  appearance:none;
}
.input:focus, .select:focus{ border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-tint); }
.input.err{ border-color:var(--danger); }
.err-msg{ font-size:12.5px; color:var(--danger); display:flex; align-items:center; gap:5px; }
.input-wrap{ position:relative; }
.input-wrap .input{ padding-right:44px; }
.input-adorn{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; color:var(--ink-faint); background:none; border:none; cursor:pointer;
}
textarea.input{ resize:vertical; min-height:90px; }

/* ---------- Bottom nav (player) ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
  box-shadow:0 -6px 20px rgba(27,35,51,.05);
}
.bottom-nav-inner{
  display:grid; grid-template-columns:1fr 1fr 74px 1fr 1fr;
  align-items:center; height:var(--nav-h); max-width:560px; margin:0 auto;
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; color:var(--ink-faint); cursor:pointer; height:100%;
  position:relative;
}
.nav-item span{ font-size:10.5px; font-weight:600; }
.nav-item.active{ color:var(--primary); }
.nav-item.active::before{
  content:""; position:absolute; top:2px; width:22px; height:3px; border-radius:3px; background:var(--primary);
}
.nav-plus-wrap{ display:flex; align-items:center; justify-content:center; height:100%; position:relative; }
.nav-plus{
  width:56px; height:56px; border-radius:50%; margin-top:-26px;
  background:linear-gradient(155deg, var(--primary-2), var(--primary-deep));
  color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 22px rgba(21,63,107,.4), 0 0 0 6px var(--bg);
  border:none; cursor:pointer;
}

/* ---------- App header ---------- */
.app-header{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding-top:calc(var(--safe-t) + 14px);
}
.app-header.solid{ background:var(--surface); border-bottom:1px solid var(--line); }

/* ---------- Balance hero ---------- */
.balance-card{
  position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--primary-deep) 0%, var(--primary) 62%, var(--primary-2) 100%);
  border-radius:var(--radius-lg);
  color:#fff; padding:22px 22px 24px;
}
.balance-card .contour{
  position:absolute; inset:-20% -10% auto auto; width:230px; height:230px; opacity:.16;
  animation:contourDrift 14s ease-in-out infinite alternate;
}
.counter-num{ font-family:var(--font-display); font-weight:600; letter-spacing:-.02em; }

/* ---------- Match card ---------- */
.match-card{
  background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--line);
  box-shadow:var(--shadow-sm); overflow:hidden; cursor:pointer;
}
.match-card-top{ padding:16px 16px 0; }
.match-card-slotbar{ height:5px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
.match-card-slotbar > i{ display:block; height:100%; background:var(--primary); border-radius:4px; }

/* ---------- Progress dots (wizard) ---------- */
.wizard-track{ display:flex; gap:6px; }
.wizard-track > i{ flex:1; height:4px; border-radius:3px; background:var(--line-strong); }
.wizard-track > i.done, .wizard-track > i.current{ background:var(--primary); }

.opt-card{
  border:1.5px solid var(--line-strong); border-radius:var(--radius-sm); padding:16px;
  cursor:pointer; background:var(--surface); transition:border-color .15s ease, background .15s ease;
}
.opt-card.selected{ border-color:var(--primary); background:var(--primary-tint); }

/* ---------- Modal / Sheet ---------- */
.modal-overlay{
  position:fixed; inset:0; background:var(--overlay); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay.center{ align-items:center; padding:20px; }
.modal-sheet{
  background:var(--surface); width:100%; max-width:520px;
  border-radius:24px 24px 0 0; padding:20px 20px calc(20px + var(--safe-b));
  max-height:88vh; overflow-y:auto;
}
.modal-overlay.center .modal-sheet{ border-radius:var(--radius-lg); max-height:85vh; }
.sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--line-strong); margin:0 auto 14px; }

/* ---------- Toast ---------- */
#toast-root{ position:fixed; top:calc(var(--safe-t) + 12px); left:50%; z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{
  animation:toastIn .25s cubic-bezier(.22,.61,.36,1) both;
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px;
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px;
  max-width:88vw;
}
:root[data-theme="dark"] .toast, @media (prefers-color-scheme:dark){ .toast{ background:var(--surface-2); } }
.toast.success{ background:var(--success); }
.toast.error{ background:var(--danger); }

/* ---------- Empty state ---------- */
.empty-state{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:52px 20px; gap:14px; }
.empty-icon{
  width:76px; height:76px; border-radius:50%; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
}

/* ---------- Loading dots ---------- */
.load-dots{ display:flex; gap:5px; align-items:center; }
.load-dots i{ width:6px; height:6px; border-radius:50%; background:currentColor; animation:dotBounce 1.1s ease-in-out infinite; }
.load-dots i:nth-child(2){ animation-delay:.15s; }
.load-dots i:nth-child(3){ animation-delay:.3s; }

.spinner{ width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite; }
.spinner-ink{ border:2.5px solid var(--line-strong); border-top-color:var(--primary); }

/* ---------- Admin / Officer shell ---------- */
.admin-shell{ display:flex; min-height:100%; }
.admin-sidebar{
  width:236px; background:var(--surface); border-right:1px solid var(--line);
  flex-shrink:0; display:none; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
}
.admin-main{ flex:1; min-width:0; }
.admin-side-link{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px;
  color:var(--ink-soft); font-weight:600; font-size:13.5px; cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.admin-side-link.active{ background:var(--primary-tint); color:var(--primary-deep); }
.admin-compact-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); padding:8px 4px calc(8px + var(--safe-b));
  display:flex; overflow-x:auto;
}
.admin-compact-item{
  flex:1; min-width:64px; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 4px; background:none; border:none; color:var(--ink-faint); font-size:10px; font-weight:600;
}
.admin-compact-item.active{ color:var(--primary); }

.stat-tile{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:16px; display:flex; flex-direction:column; gap:8px;
}
.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.data-table th{ text-align:left; color:var(--ink-faint); font-weight:600; font-size:11.5px; padding:0 12px 10px; white-space:nowrap; }
.data-table td{ padding:12px; border-top:1px solid var(--line); white-space:nowrap; }
.data-table tr:last-child td{ }

@media (min-width:900px){
  .admin-sidebar{ display:flex; }
  .admin-compact-nav{ display:none; }
}

/* ---------- Weapon picker ---------- */
.weapon-row{
  display:flex; align-items:center; justify-content:space-between; padding:13px 4px;
  border-bottom:1px solid var(--line);
}
.check-box{
  width:22px; height:22px; border-radius:7px; border:1.8px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
}
.check-box.on{ background:var(--primary); border-color:var(--primary); }

/* switch */
.switch{ width:44px; height:26px; border-radius:100px; background:var(--surface-2); border:1.5px solid var(--line-strong); position:relative; cursor:pointer; flex-shrink:0; }
.switch i{ position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s ease; }
.switch.on{ background:var(--primary); border-color:var(--primary); }
.switch.on i{ transform:translateX(18px); }

hr.div{ border:none; border-top:1px solid var(--line); margin:0; }

.avatar{
  border-radius:50%; background:var(--primary-tint); color:var(--primary-deep); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; flex-shrink:0;
}

.link{ color:var(--primary); font-weight:600; cursor:pointer; }
.container{ max-width:560px; margin:0 auto; }
.admin-container{ max-width:1180px; margin:0 auto; padding:22px 20px; }

</style>
</head>

<script>
/* ============================================================

   All data below is illustrative demo data for UI development.
   ============================================================ */

async function requestPushPermission(){
  if(!BACKEND.fbReady){ toast("Push notifications aren't available (Firebase didn't load — expected inside the Claude preview).","error"); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ toast("Notification permission not granted","error"); return; }
    const token = await BACKEND.messaging.getToken({ vapidKey: FIREBASE_VAPID_KEY, serviceWorkerRegistration: await navigator.serviceWorker.register("firebase-messaging-sw.js") });
    if(token && BACKEND.sb && DB.session){
      await BACKEND.sb.from("push_tokens").upsert({ token, phone: DB.session.phone });
    }
    toast("Push notifications enabled","success");
  }catch(e){ logSystemError("Push permission/token error: "+e.message); toast("Couldn't enable push notifications on this device/host.","error"); }
}

/* ---------- password hashing (client-side only — see Settings note) ---------- */
async function hashPassword(pw){
  try{
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ logSystemError("hashPassword failed: "+e.message); return null; }
}

/* ---------- generic fire-and-forget upsert + best-effort select ---------- */
function sbUpsert(table, row){
  if(!BACKEND.sb) return;
  BACKEND.sb.from(table).upsert(row).then(({error})=>{ if(error) logSystemError(`Supabase upsert ${table}: `+error.message); })
    .catch(e=>logSystemError(`Supabase upsert ${table}: `+e.message));
}
async function sbSelect(table, limit){
  if(!BACKEND.sb) return null;
  try{
    const { data, error } = await BACKEND.sb.from(table).select("*").limit(limit||500);
    if(error){ logSystemError(`Supabase select ${table}: `+error.message); return null; }
    return data;
  }catch(e){ logSystemError(`Supabase select ${table}: `+e.message); return null; }
}
async function sbFindProfileByPhone(phone){
  if(!BACKEND.sb) return null;
  try{
    const { data, error } = await BACKEND.sb.from("profiles").select("*").eq("phone", phone).maybeSingle();
    if(error){ logSystemError("Supabase profile lookup: "+error.message); return null; }
    return data;
  }catch(e){ logSystemError("Supabase profile lookup: "+e.message); return null; }
}

/* On load: pull shared data (matches, BR matches, notifications for this
   session's phone, officers) so a second device sees what the first one
   created. Silently does nothing if the backend isn't reachable. */
async function pullRemoteData(){
  if(!BACKEND.sb) return;
  const [matches, brMatches, officers] = await Promise.all([sbSelect("matches"), sbSelect("br_matches"), sbSelect("officers")]);
  let changed = false;
  if(matches && matches.length){ DB.matches = matches.map(remoteToMatch); changed = true; }
  if(brMatches && brMatches.length){ DB.brMatches = brMatches.map(remoteToBrMatch); changed = true; }
  if(officers && officers.length){ DB.officers = officers.map(o=>({username:o.username,name:o.name,mobile:o.mobile,status:o.status,assigned:o.assigned,verified:o.verified})); changed = true; }
  if(DB.session){
    const notifs = await sbSelect("notifications", 100);
    if(notifs){ DB.notifications = notifs.filter(n=>n.phone===DB.session.phone).map(remoteToNotif); changed = true; }
  }
  if(changed){ saveState(); if(document.getElementById("app")) render(); }
}

function futureDate(daysFromNow, hh, mm){
  const d = new Date();
  d.setDate(d.getDate() + daysFromNow);
  d.setHours(hh, mm, 0, 0);
  return d;
}
function fmtDateShort(d){
  return d.toLocaleDateString(undefined, { day:"2-digit", month:"short" });
}
function fmtTime(d){
  return d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}
function isSameDay(d1,d2){
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}
function dayLabel(d){
  const now = new Date();
  const tmr = new Date(); tmr.setDate(now.getDate()+1);
  if(isSameDay(d, now)) return "Today";
  if(isSameDay(d, tmr)) return "Tomorrow";
  return fmtDateShort(d);
}

function calcSplit(entry, commissionPct){
  const entryN = Number(entry) || 0;
  const commission = Math.round(entryN * (commissionPct/100));
  const prize = entryN - commission;
  return { prize, commission };
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ DB = JSON.parse(raw); return; }
  }catch(e){ /* fall through to fresh state */ }
  DB = freshState();
  saveState();
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ console.error("Storage error", e); }
}
function resetDemoData(){
  DB = freshState();
  saveState();
}

/* ---------- session (phone + password) ---------- */
function findAccountByPhone(phone){
  const demo = Object.values(DEMO_ACCOUNTS).find(a=>a.phone===phone);
  if(demo) return demo;
  const reg = (DB.registeredPlayers||[]).find(p=>p.phone===phone);
  return reg ? { role:"player", phone:reg.phone, uid:reg.uid, name:reg.name, gameName:reg.gameName, password:reg.password } : null;
}
function findTakenReason(uid, name, phone){
  const uidL = (uid||"").trim().toLowerCase(), nameL = (name||"").trim().toLowerCase();
  const pool = [
    DEMO_ACCOUNTS.player,
    ...OTHER_PLAYERS.map(n=>({ uid:OTHER_PLAYER_INFO[n].uid, name:n, phone:OTHER_PLAYER_INFO[n].phone })),
    ...(DB.registeredPlayers||[])
  ];
  if(phone && pool.some(p=>p.phone===phone)) return "phone";
  if(pool.some(p=>(p.uid||"").toLowerCase()===uidL)) return "uid";
  if(nameL && pool.some(p=>(p.name||"").toLowerCase()===nameL || (p.gameName||"").toLowerCase()===nameL)) return "name";
  return null;
}
function sessionActorLabel(){
  if(!DB.session) return "system";
  if(DB.session.role === "player") return DB.profile.name || DB.session.phone;
  const acc = findAccountByPhone(DB.session.phone);
  return (acc && acc.username) || DB.session.phone;
}
function loginAs(account){
  DB.session = { phone: account.phone, role: account.role };
  if(account.role === "player"){ DB.profile = { role:"player", phone:account.phone, uid:account.uid, name:account.name, gameName:account.gameName||account.name }; }
  saveState();
}
function logout(){
  DB.session = null;
  saveState();
}
function currentRole(){ return DB.session ? DB.session.role : null; }

/* ---------- wallet helpers ---------- */
function walletTotal(){ return DB.wallet.topup + DB.wallet.winnings; }
function spendPoints(amount, label, ref){
  if(walletTotal() < amount) return false;
  // spend topup first, then winnings
  let remaining = amount;
  const fromTopup = Math.min(DB.wallet.topup, remaining);
  DB.wallet.topup -= fromTopup; remaining -= fromTopup;
  DB.wallet.winnings -= remaining;
  addTransaction(label, -amount, ref);
  saveState();
  return true;
}
function creditWinnings(amount, label, ref){
  DB.wallet.winnings += amount;
  addTransaction(label, amount, ref);
  saveState();
}
function creditTopup(amount, label, ref){
  DB.wallet.topup += amount;
  addTransaction(label, amount, ref);
  saveState();
}
function addTransaction(type, points, ref){
  DB.transactions.unshift({
    id: "TX-" + Math.floor(1000+Math.random()*8999),
    type, points, status:"Completed", ts: Date.now(), ref
  });
}
function pushNotification(title, body, kind){
  const n = { id:"N"+Date.now(), title, body, ts:Date.now(), read:false, kind };
  DB.notifications.unshift(n);
  saveState();
  if(DB.session) sbUpsert("notifications", notifToRemote(n));
}
function unreadCount(){ return DB.notifications.filter(n=>!n.read).length; }

/* ---------- Formatters ---------- */
function pts(n){ return Math.round(n).toLocaleString("en-US"); }
function relTime(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m < 1) return "Just now";
  if(m < 60) return m + "m ago";
  const h = Math.floor(m/60);
  if(h < 24) return h + "h ago";
  const d = Math.floor(h/24);
  if(d < 7) return d + "d ago";
  return new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short"});
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function initials(name){
  return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

/* ---------- Toast ---------- */
function toast(msg, kind){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast " + (kind||"");
  el.innerHTML = (kind==="success"?icon("check","icon-sm"): kind==="error"?icon("alert","icon-sm"):"") + `<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .25s ease"; el.style.opacity="0"; setTimeout(()=>el.remove(),260); }, 2400);
}

/* ---------- Modal ---------- */
let modalStack = [];
function openModal(bodyHtml, opts){
  opts = opts || {};
  const root = document.getElementById("modal-root");
  const wrap = document.createElement("div");
  wrap.className = "modal-overlay " + (opts.center? "center":"");
  wrap.setAttribute("data-modal","1");
  wrap.innerHTML = `<div class="modal-sheet modal-sheet-enter">${opts.center? "" : `<div class="sheet-handle"></div>`}${bodyHtml}</div>`;
  wrap.addEventListener("click", (e)=>{ if(e.target === wrap) closeModal(); });
  root.appendChild(wrap);
  modalStack.push(wrap);
  document.body.style.overflow = "hidden";
  return wrap;
}
function closeModal(){
  const wrap = modalStack.pop();
  if(!wrap) return;
  const sheet = wrap.querySelector(".modal-sheet");
  if(sheet) sheet.classList.add("modal-sheet-exit");
  setTimeout(()=>{ wrap.remove(); if(!modalStack.length) document.body.style.overflow=""; }, 180);
}
function closeAllModals(){ while(modalStack.length) closeModal(); }

function confirmModal({title, body, confirmText, cancelText, danger, onConfirm}){
  const html = `
    <h3 style="font-size:18px;margin-bottom:8px;">${esc(title)}</h3>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:20px;">${body}</p>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost btn-block press" data-act="cm-cancel">${esc(cancelText||"Cancel")}</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'} btn-block press" data-act="cm-confirm">${esc(confirmText||"Confirm")}</button>
    </div>`;
  const wrap = openModal(html, {center:true});
  wrap.querySelector('[data-act="cm-cancel"]').onclick = closeModal;
  wrap.querySelector('[data-act="cm-confirm"]').onclick = ()=>{ closeModal(); onConfirm && onConfirm(); };
}

/* ---------- Number counter animation ---------- */
/* ---------- Image compressor (shared by every upload point) ----------
   Downscales to maxDim on the longest side and re-encodes as JPEG at the
   given quality via canvas, so uploaded photos (often several MB straight
   off a phone camera) don't blow up localStorage. Resolves to null for
   non-image files. */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith("image/")){ resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error("Could not read the file."));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("Could not decode that image."));
      img.onload = ()=>{
        try{
          let { width, height } = img;
          const scale = Math.min(1, maxDim / Math.max(width, height));
          width = Math.max(1, Math.round(width*scale));
          height = Math.max(1, Math.round(height*scale));
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve({ dataUrl, width, height, approxKB: Math.round(dataUrl.length*0.75/1024) });
        }catch(err){ reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Wires a file input -> compress -> live preview/label + stores the result
   on `state.key` for later use. labelEl shows the filename, previewEl (if
   given) gets an <img> preview. Used by every screenshot/QR upload. */
function wireImageUpload({ fileInput, labelEl, previewEl, maxDim, quality, onDone }){
  fileInput.addEventListener("change", async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(labelEl) labelEl.textContent = "Compressing\u2026";
    try{
      const result = await compressImageFile(file, maxDim, quality);
      if(!result){ toast("Please choose an image file","error"); return; }
      if(labelEl) labelEl.textContent = `${file.name} \u2014 compressed to ~${result.approxKB}KB`;
      if(previewEl){ previewEl.src = result.dataUrl; previewEl.style.display = "block"; }
      onDone && onDone(result);
    }catch(err){
      console.error(err);
      if(labelEl) labelEl.textContent = "Couldn't process that image";
      toast("Couldn't process that image","error");
    }
  });
}
function animateCounter(el, to, duration){
  const from = 0;
  const start = performance.now();
  duration = duration || 900;
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = pts(from + (to-from)*eased);
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- Router ---------- */
const routes = {};
function route(path, fn){ routes[path] = fn; }
function navigate(path){ location.hash = path; }
function roleHome(role){ return role==="admin" ? "/admin/dashboard" : role==="officer" ? "/officer/dashboard" : "/player/home"; }
function currentPath(){
  const raw = location.hash.replace(/^#/, "") || "/splash";
  return raw.split("?")[0];
}
function hashParams(){
  const raw = location.hash.replace(/^#/, "");
  const qi = raw.indexOf("?");
  return new URLSearchParams(qi>=0 ? raw.slice(qi+1) : "");
}

let activeIntervals = [];
function clearActiveIntervals(){ activeIntervals.forEach(clearInterval); activeIntervals = []; }
function render(){
  clearActiveIntervals();
  const path = currentPath();
  window.scrollTo(0,0);
  const seg = path.split("/").filter(Boolean);
  const role = currentRole();

  // guard: role-based routing
  const publicPaths = ["splash","auth"];
  if(!role && seg[0] && !publicPaths.includes(seg[0])){ navigate("/auth/login"); return; }
  if(role && seg[0] === "auth"){ navigate(roleHome(role)); return; }
  if(role && seg[0] && seg[0] !== role && seg[0] !== "splash" && seg[0] !== "auth"){
    // block cross-role access
    navigate(roleHome(role)); return;
  }

  const matcher = Object.keys(routes).find(pattern=>{
    const pSeg = pattern.split("/").filter(Boolean);
    if(pSeg.length !== seg.length) return false;
    return pSeg.every((p,i)=> p.startsWith(":") || p === seg[i]);
  });
  const app = document.getElementById("app");
  if(!matcher){ app.innerHTML = notFoundView(); return; }
  const params = {};
  matcher.split("/").filter(Boolean).forEach((p,i)=>{ if(p.startsWith(":")) params[p.slice(1)] = seg[i]; });
  app.innerHTML = `<div class="view-enter">${routes[matcher](params)}</div>`;
  afterRender(path, params);
}
function notFoundView(){
  return `<div class="empty-state" style="padding-top:120px;">
    <div class="empty-icon">${icon("mountain","icon-lg")}</div>
    <h3 style="font-size:17px;">Lost on the trail</h3>
    <p style="color:var(--ink-soft);font-size:14px;">That page doesn't exist.</p>
    <button class="btn btn-primary press" onclick="navigate(currentRole()? roleHome(currentRole()) : '/auth/login')">Back to base camp</button>
  </div>`;
}

window.addEventListener("hashchange", render);

/* ---------- OTP registration flow state (not persisted — a fresh session
   always restarts registration from the phone step) ---------- */
let pendingRegistration = null;
function generateOtp(){ return String(Math.floor(100000 + Math.random()*900000)); }
/* Calls the send-otp-sms Supabase Edge Function (see send-otp-sms/index.ts).
   The real Kusha SMS key lives only in that function's server-side secrets —
   never here. Falls back gracefully (and the on-screen demo code still
   works) if the function isn't deployed yet or the network is unreachable. */
async function sendOtpSms(phone, otp){
  if(!BACKEND.sb) return { sent:false, reason:"Backend not connected" };
  try{
    const { data, error } = await BACKEND.sb.functions.invoke("send-otp-sms", { body:{ phone, otp } });
    if(error) return { sent:false, reason:error.message };
    if(data && data.ok) return { sent:true };
    return { sent:false, reason:(data&&data.error)||"Unknown error" };
  }catch(e){ return { sent:false, reason:e.message }; }
}
function startOtpFlow(phone){
  const otp = generateOtp();
  pendingRegistration = { phone, otp, expiresAt: Date.now()+5*60*1000, resendAt: Date.now()+30*1000, verified:false, attempts:0, smsStatus:"sending" };
  sendOtpSms(phone, otp).then(r=>{
    if(!pendingRegistration || pendingRegistration.phone!==phone) return;
    pendingRegistration.smsStatus = r.sent ? "sent" : "failed";
    pendingRegistration.smsError = r.reason;
    if(document.getElementById("otp-form")) render();
  });
}

function registerPhoneView(){
  return authShell(`

function showFieldError(form, name, msg){
  const input = form.querySelector(`[name="${name}"]`);
  const err = form.querySelector(`[data-err="${name}"]`);
  if(input) input.classList.add("err");
  if(err){ err.style.display="flex"; err.innerHTML = icon("alert","icon-sm") + esc(msg); }
}
function clearFieldError(form, name){
  const input = form.querySelector(`[name="${name}"]`);
  const err = form.querySelector(`[data-err="${name}"]`);
  if(input) input.classList.remove("err");
  if(err) err.style.display="none";
}
function clearAllErrors(form){
  form.querySelectorAll(".input").forEach(i=>i.classList.remove("err"));
  form.querySelectorAll("[data-err]").forEach(e=>e.style.display="none");
}

function wireLoginForm(){
  const form = document.getElementById("login-form");
  if(!form) return;
  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    clearAllErrors(form);
    const phone = form.phone.value.trim();
    const password = form.password.value;
    let ok = true;
    if(!/^\d{10}$/.test(phone)){ showFieldError(form,"phone","Enter exactly 10 digits."); ok=false; }
    if(!password){ showFieldError(form,"password","Enter your password."); ok=false; }
    if(!ok) return;
    let acc = findAccountByPhone(phone);
    if(acc && acc.password === password){ loginAs(acc); toast("Welcome back, "+ (acc.name||"").split(" ")[0] +"!","success"); navigate(roleHome(acc.role)); return; }
    // not found locally (or wrong local password) — try the shared backend
    // in case this account was registered on a different device
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Checking…"; }
    const remote = await sbFindProfileByPhone(phone);
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Log in"; }
    if(remote){
      const hash = await hashPassword(password);
      if(hash && hash === remote.password_hash){
        acc = { role:remote.role, phone:remote.phone, uid:remote.uid, name:remote.name, gameName:remote.game_name, password };
        DB.registeredPlayers = DB.registeredPlayers || [];
        DB.registeredPlayers.push({ phone:remote.phone, uid:remote.uid, name:remote.name, gameName:remote.game_name, password });
        loginAs(acc);
        toast("Welcome back, "+ (acc.name||"").split(" ")[0] +"!","success");
        navigate(roleHome(acc.role));
        return;
      }
    }
    showFieldError(form,"password","Incorrect phone number or password.");
    return;
  });
}

function wireOtpForm(){
  const form = document.getElementById("otp-form");
  if(!form || !pendingRegistration) return;
  const resendBtn = document.getElementById("resend-otp-btn");
  function tickResend(){
    const left = pendingRegistration.resendAt - Date.now();
    if(left <= 0){ resendBtn.disabled = false; resendBtn.textContent = "Resend OTP"; return; }
    resendBtn.disabled = true;
    resendBtn.textContent = `Resend OTP in ${Math.ceil(left/1000)}s`;
  }
  tickResend();
  const iv = setInterval(tickResend, 1000);
  activeIntervals.push(iv);
  resendBtn.addEventListener("click", ()=>{
    if(resendBtn.disabled) return;
    pendingRegistration.otp = generateOtp();
    pendingRegistration.expiresAt = Date.now()+5*60*1000;
    pendingRegistration.resendAt = Date.now()+30*1000;
    pendingRegistration.smsStatus = "sending";
    toast("New code: "+pendingRegistration.otp, "success");
    sendOtpSms(pendingRegistration.phone, pendingRegistration.otp).then(r=>{
      if(!pendingRegistration) return;
      pendingRegistration.smsStatus = r.sent ? "sent" : "failed";
      pendingRegistration.smsError = r.reason;
      if(document.getElementById("otp-form")) render();
    });
    render();
  });
  form.addEventListener("submit", (e)=>{
    e.preventDefault();
    clearAllErrors(form);
    const code = document.getElementById("otp-input").value.trim();
    if(!/^\d{6}$/.test(code)){ showFieldError(form,"otp","Enter the 6-digit code."); return; }
    if(Date.now() > pendingRegistration.expiresAt){
      showFieldError(form,"otp","This code expired — resend a new one.");
      pushNotification("OTP expired", "Your verification code expired. Please resend.", "account");
      return;
    }
    pendingRegistration.attempts++;
    if(code !== pendingRegistration.otp){
      showFieldError(form,"otp","Incorrect code. Try again.");
      pushNotification("OTP verification failed", "An incorrect code was entered during sign-up.", "account");
      return;
    }
    pendingRegistration.verified = true;
    toast("Number verified","success");
    navigate("/auth/register-details");
  });
}
function wireRegisterDetailsForm(){
  const form = document.getElementById("register-details-form");
  if(!form || !pendingRegistration) return;
  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    clearAllErrors(form);
    const v = Object.fromEntries(new FormData(form).entries());
    const playerName = (v.playerName||"").trim(), gameName = (v.gameName||"").trim(), uid = (v.uid||"").trim();
    const password = v.password||"", confirm = v.confirm||"";
    const phone = pendingRegistration.phone;
    let ok = true;
    if(!playerName){ showFieldError(form,"playerName","Enter a player name."); ok=false; }
    if(!gameName){ showFieldError(form,"gameName","Paste your in-game name."); ok=false; }
    if(!uid){ showFieldError(form,"uid","Paste your Player UID."); ok=false; }
    if(password.length<6){ showFieldError(form,"password","At least 6 characters."); ok=false; }
    if(confirm!==password){ showFieldError(form,"confirm","Passwords do not match."); ok=false; }
    if(ok){
      const reason = findTakenReason(uid, playerName, null) || findTakenReason(uid, gameName, null);
      if(reason==="uid"){ showFieldError(form,"uid","This UID is already registered."); ok=false; }
      else if(reason==="name"){ showFieldError(form,"playerName","This name is already taken."); ok=false; }
    }
    if(!ok) return;
    const submitBtn = form.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Creating account…"; }
    if(BACKEND.sb){
      const remoteClash = await sbFindProfileByPhone(phone);
      if(remoteClash){
        if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Create account"; }
        showFieldError(form,"playerName","That phone number is already registered on another device.");
        return;
      }
    }
    DB.registeredPlayers = DB.registeredPlayers || [];
    DB.registeredPlayers.push({ phone, uid, name:playerName, gameName, password });
    // also surface the new player in the admin roster
    DB.players.push({ id:phone, name:playerName, uid, phone, status:"Active", joined:new Date().toISOString().slice(0,10), matches:0, balance:0 });
    const hash = await hashPassword(password);
    sbUpsert("profiles", { phone, role:"player", name:playerName, game_name:gameName, uid, password_hash: hash || "unavailable" });
    loginAs({ role:"player", phone, uid, name:playerName, gameName });
    pendingRegistration = null;
    toast("Account created — welcome to Everest Arena!","success");
    navigate("/player/home");
  });
}

/* Player UID / Player Name fields only ever accept pasted input (never typed)
   so they exactly match what's copied from the game, per spec. Native paste
   (Ctrl/Cmd+V or the OS long-press "Paste") still works — only typed
   characters are blocked — so no Clipboard-API permissions are needed. */
function enforcePasteOnly(root){
  root.querySelectorAll(".paste-only").forEach(inp=>{
    if(inp.dataset.pasteBound) return;
    inp.dataset.pasteBound = "1";
    inp.addEventListener("keydown", (e)=>{
      const allowed = ["Backspace","Delete","Tab","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"];
      if(allowed.includes(e.key)) return;
      if((e.ctrlKey||e.metaKey) && ["a","c","v","x"].includes(e.key.toLowerCase())) return;
      e.preventDefault();
    });
  });
}
function wireAuthCommon(root){
  enforcePasteOnly(root);
  root.querySelectorAll('[data-action="toggle-pw"]').forEach(btn=>{
    if(btn.dataset.pwBound) return;
    btn.dataset.pwBound = "1";
    btn.addEventListener("click", ()=>{
      const input = document.getElementById(btn.dataset.target);
      if(!input) return;
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.innerHTML = icon(show?"eyeOff":"eye","icon-sm");
    });
  });
}

/* A match "has an opponent" once more than just the creator has joined — at
   that point it's a private lobby between those specific players, so it's
   dropped from everyone else's browse list. Players still see: open matches
   (no opponent yet, joinable) and any match they're personally in. */
function hasOpponent(m){ return m.filled > 1 || !!m.opponentName; }
function canPlayerView(m){ return !hasOpponent(m) || m.participants.includes("You"); }

/* Checked on every Home visit: nudge the player if a match they're in starts
   within 15 minutes and they haven't been reminded yet. */
function checkMatchReminders(){
  const soon = Date.now() + 15*60000;
  [...DB.matches, ...DB.brMatches].forEach(m=>{
    const joined = m.participants.some(p=> p==="You" || p.name==="You");
    if(!joined || m.reminded) return;
    const start = new Date(m.dateISO).getTime();
    if(start > Date.now() && start <= soon){
      pushNotification("Match starting soon", `${m.id} starts in under 15 minutes — get ready!`, "match");
      m.reminded = true;
      saveState();
    }
  });
}

function addPointsPaymentModal(amount){
  const hasRealQr = !!DB.settings.paymentQr;
  const html = `

    <div style="display:flex;justify-content:center;margin-bottom:14px;">

      <div class="field">
        <label>Payment screenshot</label>

        </label>

      </div>

    </form>`;
  const wrap = openModal(html);
  let screenshot = null;
  wireImageUpload({
    fileInput: wrap.querySelector("#ss-file"),
    labelEl: wrap.querySelector("#ss-text"),
    previewEl: wrap.querySelector("#ss-preview"),
    maxDim: 1000, quality: 0.72,
    onDone: (result)=>{ screenshot = result.dataUrl; }
  });
  wrap.querySelector("#deposit-form").addEventListener("submit",(e)=>{
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target).entries());
    if(!v.ref){ toast("Add a transaction reference ID","error"); return; }
    const dep = { id:"DEP-"+Math.floor(Math.random()*900+100), player:"You", points:amount, ref:v.ref, note:v.note||"", screenshot, ts:Date.now(), status:"PENDING" };
    DB.deposits.unshift(dep);
    saveState();
    closeModal();
    toast("Deposit submitted — pending verification","success");
    navigate("/player/account");
  });
}
function placeholderQR(){
  // Deterministic pseudo-QR pattern for demo purposes only (not scannable).
  let cells = "";
  let seed = 42;
  function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
  for(let y=0;y<11;y++) for(let x=0;x<11;x++){
    const isFinder = (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);
    const on = isFinder ? ((x%3!==1 && y%3!==1) ? 1 : (x===1&&y===1?0:1)) : (rnd()>.55?1:0);
    if(on) cells += `<rect x="${x*10}" y="${y*10}" width="9" height="9" rx="1.5"/>`;
  }
  return `<svg width="160" height="160" viewBox="0 0 110 110" style="background:#fff;border-radius:14px;padding:6px;" fill="var(--ink)">${cells}</svg>`;
}

function fmtCountdown(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function matchCTA(m){
  const joined = m.participants.includes("You");
  if(m.status === "CANCELLED") return `<button class="btn btn-ghost btn-block" disabled>Cancelled</button>`;
  if(joined && m.youJoinedAt && !myReport(m) && !["VERIFIED","DISPUTED"].includes(m.status)){
    const ready = Date.now() - m.youJoinedAt >= 60000;
    if(ready) return `<button class="btn btn-gold btn-block press" data-action="open-submit-result" data-id="${m.id}">Submit result</button>`;
    return `<button class="btn btn-ghost btn-block" id="result-wait-btn" data-ready-at="${m.youJoinedAt+60000}" disabled>Submit result opens in ${fmtCountdown(60000-(Date.now()-m.youJoinedAt))}</button>`;
  }
  if(["PENDING_VERIFICATION","VERIFIED","DISPUTED"].includes(m.status)){
    return `<button class="btn btn-ghost btn-block press" data-action="goto" data-path="/player/match/${m.id}">View details</button>`;
  }
  if(joined) return `<button class="btn btn-secondary btn-block press" data-action="goto" data-path="/player/match/${m.id}">View details</button>`;
  if(m.status === "UPCOMING") return `<button class="btn btn-primary btn-block press" data-action="open-join" data-id="${m.id}">Join match</button>`;
  return `<button class="btn btn-ghost btn-block press" data-action="goto" data-path="/player/match/${m.id}">View details</button>`;
}

function submitMyReport(matchId, won, screenshotName){
  const m = DB.matches.find(x=>x.id===matchId);
  if(!m) return;
  m.reports = m.reports || {};
  m.reports.a = { name:"You", won, screenshot:screenshotName||null, ts:Date.now() };
  saveState();
  closeModal();
  toast(won? "Result submitted — nice work!" : "Result submitted.","success");
  scheduleOpponentReport(matchId);
  render();
}
/* Simulates the other side's report a few seconds later. Deterministic per
   match (hashed from the match id) so retesting the same match is
   consistent; a real build would replace this with the other player's own
   submission. */
function scheduleOpponentReport(matchId){
  setTimeout(()=>{
    const m = DB.matches.find(x=>x.id===matchId);
    if(!m || !m.reports || !m.reports.a || m.reports.b) return;
    const seed = [...matchId].reduce((s,c)=>s+c.charCodeAt(0), 0);
    const oppWon = m.reports.a.won ? (seed % 2 === 0) : true;
    m.reports.b = { name: m.opponentName || "Opponent", won: oppWon, ts: Date.now() };
    reconcileResult(m);
    if(["/player/game","/player/home"].includes(currentPath()) || currentPath()==="/player/match/"+matchId) render();
  }, 5000);
}
/* Screenshots have done their job once a result is final (verified either
   way) — drop them to keep localStorage lean, per the storage-cleanup
   requirement. Left intact while still PENDING_VERIFICATION since the
   officer needs to see them. */
function clearMatchScreenshots(m){
  if(m.reports){
    if(m.reports.a) m.reports.a.screenshot = null;
    if(m.reports.b) m.reports.b.screenshot = null;
  }
}
function reconcileResult(m){
  const a = m.reports.a, b = m.reports.b;
  if(!a || !b) return;
  const bothYes = a.won && b.won, bothNo = !a.won && !b.won;
  const involvesYou = m.participants.includes("You");
  if(!bothYes && !bothNo){
    const winner = a.won ? a.name : b.name;
    m.status = "VERIFIED";
    m.result = { winner, verified:true, source:"auto" };
    if(winner==="You"){
      creditWinnings(m.prize, "Winning", m.id);
      pushNotification("Prize credited", `You won ${pts(m.prize)} points from ${m.id}.`, "prize");
    } else if(involvesYou){
      pushNotification("Match result", `${winner} was declared the winner of ${m.id}.`, "match");
    }
    clearMatchScreenshots(m);
  } else {
    m.status = "PENDING_VERIFICATION";
    if(involvesYou) pushNotification("Sent for verification", `Your result for ${m.id} needs officer review — both reports didn't line up.`, "match");
  }
  saveState();
  sbUpsert("matches", matchToRemote(m));
}

/* Simulates another player joining a match You created, so the room-ID flow
   is testable from the creator's side without a second real account. */
function scheduleNpcAutoJoin(matchId){
  setTimeout(()=>{
    const m = DB.matches.find(x=>x.id===matchId);
    if(!m || m.roomDeadline || m.filled>=m.capacity) return;
    const pool = OTHER_PLAYERS.filter(n=>!m.participants.includes(n));
    const joiner = pool[Math.floor(Math.random()*pool.length)] || "Challenger";
    m.participants.push(joiner); m.filled++;
    if(m.filled>=m.capacity) m.status = "FULL";
    m.opponentName = joiner;
    m.roomDeadline = Date.now() + 5*60*1000;
    saveState();
    pushNotification("Player joined your match", `${joiner} joined ${m.mode} ${m.format}. Submit the Room ID & Password within 5 minutes.`, "match");
    if(["/player/game","/player/home"].includes(currentPath()) || currentPath()==="/player/match/"+matchId) render();
  }, 6000);
}

    rounds:null, date:"", time:"", weapons:[], entry:20, armor:[] };

const WIZ_TITLES = ["Game mode","Team format","Game settings","Rounds","Date & time","Weapons","Entry points","Review"];

function openCreateMatchWizard(){
  wiz = freshWiz();

  }
  if(wiz.step===6){
    body.querySelector("#wiz-wsearch").addEventListener("input", e=>{ document.getElementById("wiz-wlist").innerHTML = wizWeaponRows(e.target.value); });
    body.querySelector("#wiz-selectall").addEventListener("click", ()=>{
      wiz.weapons = wiz.weapons.length===WEAPONS.length ? [] : [...WEAPONS];
      renderWizStep();
    });
  }
  if(wiz.step===7){
    body.querySelector("#wiz-entry").addEventListener("input", e=>{
      wiz.entry = Math.max(0, parseInt(e.target.value||"0",10));
      const {prize,commission} = calcSplit(wiz.entry, DB.settings.commissionPct);
      document.getElementById("wiz-split").innerHTML = splitRows(wiz.entry, prize, commission);
    });
  }
}
function wizNext(){
  const s = wiz;
  if(s.step===1 && !s.mode){ toast("Select a game mode","error"); return; }
  if(s.step===2 && !s.format){ toast("Select a team format","error"); return; }
  if(s.step===4 && !s.rounds){ toast("Select rounds","error"); return; }
  if(s.step===5 && (!s.date || !s.time)){ toast("Pick a date and time","error"); return; }
  if(s.step===7 && s.entry < DB.settings.minEntry){ toast(`Minimum entry is ${DB.settings.minEntry} points`,"error"); return; }
  if(s.step===8){ wizCreate(); return; }
  s.step++;
  renderWizStep();
}
function wizCreate(){
  const s = wiz;
  if(walletTotal() < s.entry){ toast("Insufficient balance to create this match","error"); return; }
  const {prize, commission} = calcSplit(s.entry, DB.settings.commissionPct);
  spendPoints(s.entry, "Match Entry", "new-match");
  const teamSize = parseInt(s.format[0]);
  const m = {
    id:"EA-"+(1100+Math.floor(Math.random()*899)),
    game:"Free Fire", mode:s.mode, format:s.format,
    dateISO:new Date(s.date+"T"+s.time).toISOString(),

    capacity: Math.max(teamSize*2, teamSize*4),
    filled:1, status:"UPCOMING", rounds:s.rounds, settings:s.settings,
    weapons:s.weapons, armor:["Any"], createdBy:"You", participants:["You"],
    result:null, verification:null,
    youJoinedAt: Date.now(), roomDeadline:null, roomId:null, roomPassword:null, opponentName:null, reports:{}
  };
  DB.matches.unshift(m);
  saveState();
  sbUpsert("matches", matchToRemote(m));
  closeCreateMatchWizard();
  toast("Match created!","success");

  scheduleNpcAutoJoin(m.id);
}

function computeStats(){
  const players = DB.players;
  const matches = DB.matches;
  const dep = DB.deposits, wd = DB.withdrawals;
  const entryFeesTotal = DB.transactions.filter(t=>t.type==="Match Entry").reduce((s,t)=>s+Math.abs(t.points),0);
  const commissionTotal = matches.filter(m=>!["CANCELLED"].includes(m.status)).reduce((s,m)=>s+m.commission,0);
  const depositsApproved = dep.filter(d=>d.status==="APPROVED").reduce((s,d)=>s+d.points,0);
  const withdrawalsPaid = wd.filter(w=>w.status==="PAID"||w.status==="APPROVED").reduce((s,w)=>s+w.points,0);
  return {
    totalPlayers: players.length,
    activePlayers: players.filter(p=>p.status==="Active").length,
    totalMatches: matches.length,
    liveMatches: matches.filter(m=>m.status==="LIVE").length,
    completedMatches: matches.filter(m=>["COMPLETED","VERIFIED"].includes(m.status)).length,
    pendingVerification: matches.filter(m=>m.status==="PENDING_VERIFICATION").length,
    totalDeposits: depositsApproved,
    totalWithdrawals: withdrawalsPaid,
    totalEntryFees: entryFeesTotal,
    commission: commissionTotal,
    profit: commissionTotal, // no separate platform-expense tracking in this demo
    pendingWithdrawals: wd.filter(w=>w.status==="PENDING").length,
    pendingDeposits: dep.filter(d=>d.status==="PENDING").length,
    officerVerifications: DB.officers.reduce((s,o)=>s+o.verified,0),
    disputed: matches.filter(m=>m.status==="DISPUTED").length,
  };
}

function statTile(label, value, accent){
  return `<div class="stat-tile"><div style="font-size:11.5px;color:var(--ink-soft);">${label}</div><div class="tabular" style="font-family:var(--font-display);font-weight:600;font-size:20px;${accent?`color:var(--${accent});`:''}">${value}</div></div>`;
}

function barChart(values, labels){
  const max = Math.max(...values, 1);
  const w = 300, h = 120, bw = w/values.length;
  const bars = values.map((v,i)=>{
    const bh = Math.max(4,(v/max)*(h-24));
    return `<rect x="${i*bw+bw*0.22}" y="${h-bh}" width="${bw*0.56}" height="${bh}" rx="4" fill="var(--primary)"/>
    <text x="${i*bw+bw/2}" y="${h+16}" font-size="9" fill="var(--ink-faint)" text-anchor="middle">${labels[i]}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h+22}" style="width:100%;height:auto;font-family:var(--font-body);">${bars}</svg>`;
}

/* ---------------- SYSTEM HEALTH ---------------- */
/* There's no real backend in this build, so "system health" here means the
   actual, honest state of the one real thing this app has: the browser's
   local storage. Figures below are computed live, not simulated. */
function estimateImageBytes(){
  let n = 0;
  const add = s => { if(s) n += s.length*0.75; };
  (DB.deposits||[]).forEach(d=>add(d.screenshot));
  (DB.matches||[]).forEach(m=>{ if(m.reports){ add(m.reports.a&&m.reports.a.screenshot); add(m.reports.b&&m.reports.b.screenshot); } });
  (DB.support||[]).forEach(s=>add(s.screenshot));
  add(DB.settings.paymentQr);
  return Math.round(n);
}
function computeStorageUsage(){
  let usedBytes = 0, readable = false, writable = false;
  try{
    const json = JSON.stringify(DB);
    usedBytes = json.length;
    const probe = "__ea_health_probe__";
    localStorage.setItem(probe, "1"); writable = true;
    readable = localStorage.getItem(probe) === "1";
    localStorage.removeItem(probe);
  }catch(e){ /* storage unavailable or full — surfaced via readable/writable flags */ }
  const quotaBytes = 5*1024*1024; // conservative, widely-supported baseline
  const imageBytes = estimateImageBytes();
  return {
    usedBytes, quotaBytes, pct: Math.min(100, Math.round(usedBytes/quotaBytes*100)),
    imageBytes, readable, writable,
    matchCount: (DB.matches||[]).length + (DB.brMatches||[]).length,
    notifCount: (DB.notifications||[]).length,
  };
}
function fmtBytes(b){
  if(b < 1024) return b+" B";
  if(b < 1024*1024) return (b/1024).toFixed(1)+" KB";
  return (b/1024/1024).toFixed(2)+" MB";
}
route("/admin/health", ()=>{
  const u = computeStorageUsage();
  const errs = DB.systemErrors||[];
  return adminShell("health","System Health", `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;">
      ${statTile("Supabase backend", BACKEND.sb?"Connected":"Not connected", BACKEND.sb?"success":"warning")}
      ${statTile("Firebase push", BACKEND.fbReady?"Ready":"Not loaded", BACKEND.fbReady?"success":"warning")}
      ${statTile("Local storage used", u.pct+"%", u.pct>80?"danger":u.pct>50?"warning":"success")}
      ${statTile("Errors logged", errs.length, errs.length?"danger":"success")}
    </div>
    <div class="card card-pad" style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <h4 style="font-size:14px;">Local storage usage</h4>
        <span class="tabular" style="font-size:13px;color:var(--ink-soft);">${fmtBytes(u.usedBytes)} / ~${fmtBytes(u.quotaBytes)}</span>
      </div>
      <div style="height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;">
        <div style="height:100%;width:${u.pct}%;background:${u.pct>80?'var(--danger)':u.pct>50?'var(--warning)':'var(--success)'};border-radius:5px;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--ink-soft);">
        <span>Images/screenshots: ${fmtBytes(u.imageBytes)}</span>

      </div>
    </div>
    <div class="card card-pad" style="margin-bottom:18px;">
      <h4 style="font-size:14px;margin-bottom:10px;">Recent errors</h4>
      ${errs.length ? errs.slice(0,8).map(e=>`<div style="padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;"><b style="color:var(--danger);">${esc(e.message)}</b><div style="color:var(--ink-faint);">${relTime(e.ts)}</div></div>`).join("")

function logAudit(action){
  DB.auditLog.unshift({ ts:Date.now(), actor:sessionActorLabel(), action });
  saveState();
}
function bumpOfficerVerified(){
  const acc = findAccountByPhone(DB.session.phone);
  const o = DB.officers.find(x=>x.username===(acc&&acc.username));
  if(o) o.verified++;
}

function officerDecide(id, winnerNameOrFlag){
  const m = DB.matches.find(x=>x.id===id);
  if(!m) return;
  const notesEl = document.getElementById("officer-notes");
  const notes = notesEl ? notesEl.value : "";
  const involvesYou = m.createdBy==="You" || m.participants.includes("You");
  if(winnerNameOrFlag === "__flag__"){
    m.status = "DISPUTED";
    if(involvesYou) pushNotification("Match disputed", `${m.id} was flagged as disputed and is under admin review.`, "match");
    logAudit(`Flagged ${m.id} as disputed${notes? " ("+notes+")":""}`);
    toast("Match flagged as disputed","success");
  } else {
    const winner = winnerNameOrFlag;
    m.status = "VERIFIED";
    m.result = { winner, verified:true, source:"admin" };
    if(winner==="You" && involvesYou){
      creditWinnings(m.prize, "Winning", m.id);
      pushNotification("Prize credited", `Your win on ${m.id} was verified — ${pts(m.prize)} points credited.`, "prize");
    } else if(involvesYou){
      pushNotification("Match verified", `${winner} was confirmed as the winner of ${m.id}.`, "match");
    }
    clearMatchScreenshots(m);
    bumpOfficerVerified();
    logAudit(`Verified ${m.id} — winner ${winner}${notes? " ("+notes+")":""}`);
    toast("Winner confirmed","success");
  }
  saveState();
  sbUpsert("matches", matchToRemote(m));
  navigate("/officer/dashboard");
}

function adminCancelMatch(id){
  const m = DB.matches.find(x=>x.id===id);
  if(!m) return;
  confirmModal({
    title:"Cancel this match?", danger:true, confirmText:"Cancel & refund",
    body:`All ${m.filled} participant(s) will be refunded ${pts(m.entry)} points each. This can't be undone.`,
    onConfirm:()=>{
      if(m.participants.includes("You")) creditTopup(m.entry, "Refund", m.id);
      m.status = "CANCELLED";
      logAudit(`Cancelled ${m.id} and issued refunds`);
      if(m.participants.includes("You")) pushNotification("Match cancelled", `${m.id} was cancelled and your entry was refunded.`, "match");
      saveState();
      sbUpsert("matches", matchToRemote(m));
      toast("Match cancelled and refunded","success");
      render();
    }
  });
}
function openAdminResolveDisputeModal(id){
  const m = DB.matches.find(x=>x.id===id);
  if(!m) return;
  const a = m.reports && m.reports.a, b = m.reports && m.reports.b;

      <button class="btn btn-danger btn-block press" data-act="refund">Cancel &amp; refund all</button>
      <button class="btn btn-ghost btn-block press" data-act="close">Close</button>

function officerDecideAsAdmin(id, winner){
  const m = DB.matches.find(x=>x.id===id);
  if(!m) return;
  m.status = "VERIFIED";
  m.result = { winner, verified:true, source:"admin" };
  if(winner==="You" && m.participants.includes("You")){
    creditWinnings(m.prize, "Winning", m.id);

  saveState();
  sbUpsert("matches", matchToRemote(m));
  toast("Dispute resolved","success");
  render();
}

      const rc = document.getElementById("room-countdown");
      if(rc){
        const left = Number(rc.dataset.deadline) - Date.now();
        if(left <= 0){ render(); return; }
        rc.textContent = fmtCountdown(left);
      }
      const rb = document.getElementById("result-wait-btn");
      if(rb){
        const left = Number(rb.dataset.readyAt) - Date.now();
        if(left <= 0){ render(); return; }
        rb.textContent = "Submit result opens in " + fmtCountdown(left);
      }
      const brc = document.getElementById("br-room-countdown");
      if(brc){
        const left = Number(brc.dataset.revealAt) - Date.now();
        if(left <= 0){ render(); return; }
        brc.innerHTML = "Room details unlock in <b class=\"tabular\">"+fmtCountdown(left)+"</b>";
      }
    }, 1000);
    activeIntervals.push(id);
  }

  if(path === "/player/add-points"){
    const form = document.getElementById("addpts-form");
    form && form.addEventListener("submit",(e)=>{
      e.preventDefault();
      const amt = parseInt(document.getElementById("ap-amount").value||"0",10);
      if(!amt || amt<=0){ toast("Enter an amount","error"); return; }
      addPointsPaymentModal(amt);
    });
  }
  if(path === "/player/withdraw" && DB.settings.withdrawEnabled){
    const form = document.getElementById("withdraw-form");
    form && form.addEventListener("submit",(e)=>{
      e.preventDefault();
      clearAllErrors(form);
      const v = Object.fromEntries(new FormData(form).entries());
      const amt = parseInt(v.amount||"0",10);
      let ok = true;
      if(!amt || amt < DB.settings.minWithdraw){ showFieldError(form,"amount",`Minimum withdrawal is ${DB.settings.minWithdraw} points.`); ok=false; }
      else if(amt > DB.wallet.winnings){ showFieldError(form,"amount","You don't have enough winning points."); ok=false; }
      if(!v.account){ toast("Enter your account or wallet ID","error"); ok=false; }
      if(!ok) return;
      DB.wallet.winnings -= amt;
      DB.withdrawals.unshift({ id:"WD-"+Math.floor(Math.random()*900+100), player:"You", points:amt, method:v.method, account:v.account, name:v.name, ts:Date.now(), status:"PENDING" });
      addTransaction("Withdrawal", -amt, "pending");
      saveState();
      pushNotification("Withdrawal submitted", `Your request to withdraw ${pts(amt)} points is pending review.`, "withdrawal");
      toast("Withdrawal request submitted","success");
      navigate("/player/account");
    });
  }
  if(path === "/player/edit-profile"){
    const form = document.getElementById("edit-profile-form");
    form && form.addEventListener("submit",(e)=>{
      e.preventDefault();
      const v = Object.fromEntries(new FormData(form).entries());
      DB.profile = { ...DB.profile, ...v };
      saveState(); toast("Profile updated","success"); navigate("/player/account");
    });
  }
  if(path === "/player/support"){
    const form = document.getElementById("support-form");
    let srShot = null;
    const srFile = document.getElementById("sr-ss-file");
    if(srFile){
      wireImageUpload({
        fileInput: srFile, labelEl: document.getElementById("sr-ss-text"), previewEl: document.getElementById("sr-ss-preview"),
        maxDim: 1000, quality: 0.72, onDone: (result)=>{ srShot = result.dataUrl; }
      });
    }
    form && form.addEventListener("submit",(e)=>{
      e.preventDefault();
      const v = Object.fromEntries(new FormData(form).entries());
      if(!v.subject){ toast("Add a subject","error"); return; }
      DB.support.unshift({ id:"SR-"+Math.floor(Math.random()*90+10), player:"You", subject:v.subject, category:v.category, screenshot:srShot, ts:Date.now(), status:"Open" });
      saveState(); toast("Support request submitted","success"); navigate("/player/account");
    });
  }
  if(path === "/admin/settings"){
    const sf = document.getElementById("settings-form");
    sf && sf.addEventListener("submit",(e)=>{
      e.preventDefault();
      const v = Object.fromEntries(new FormData(sf).entries());
      DB.settings.commissionPct = Math.max(0, Math.min(90, parseInt(v.commissionPct,10)||20));
      DB.settings.minEntry = Math.max(1, parseInt(v.minEntry,10)||10);
      DB.settings.minWithdraw = Math.max(1, parseInt(v.minWithdraw,10)||100);
      saveState(); toast("Settings saved","success"); render();
    });
    const af = document.getElementById("announce-form");
    af && af.addEventListener("submit",(e)=>{
      e.preventDefault();
      const v = Object.fromEntries(new FormData(af).entries());
      if(!v.title){ toast("Add a title","error"); return; }
      pushNotification(v.title, v.body||"", "admin");
      logAudit(`Sent announcement: ${v.title}`);
      toast("Announcement sent","success"); af.reset();
    });
    const otpKeyForm = document.getElementById("otp-key-form");
    otpKeyForm && otpKeyForm.addEventListener("submit",(e)=>{
      e.preventDefault();
      const val = document.getElementById("otp-key-input").value;
      if(!val.trim()){ toast("Enter a key first","error"); return; }
      // intentionally never persisted — see the warning note above the field
      DB.settings.otpApiKeySet = true;
      saveState();
      logAudit("OTP API key marked as configured (value not stored)");
      toast("Marked as configured — the value itself was not saved anywhere","success");
      render();
    });
    const qrFile = document.getElementById("qr-file");
    if(qrFile){
      wireImageUpload({
        fileInput: qrFile,
        labelEl: document.getElementById("qr-upload-label"),
        previewEl: document.getElementById("qr-preview"),
        maxDim: 640, quality: 0.9, // higher quality + modest size so the QR stays scannable
        onDone: (result)=>{
          DB.settings.paymentQr = result.dataUrl;
          saveState();
          logAudit("Updated payment QR code");
          toast("QR code updated","success");
          render();
        }
      });
    }
  }
  if(path.startsWith("/admin/players")){
    const search = document.getElementById("pl-search");
    search && search.addEventListener("input", ()=>{
      const q = search.value.toLowerCase();
      document.querySelectorAll("#players-table tr[data-row-name]").forEach(row=>{
        row.style.display = row.dataset.rowName.includes(q) ? "" : "none";
      });
    });
  }
}

/* ---------------- init ---------------- */
function logSystemError(message){
  try{
    if(!DB) return;
    DB.systemErrors = DB.systemErrors || [];
    DB.systemErrors.unshift({ message: String(message).slice(0,200), ts: Date.now() });
    DB.systemErrors = DB.systemErrors.slice(0,50);
    saveState();
  }catch(e){ /* storage itself may be the problem — nothing more we can do client-side */ }
}
window.addEventListener("error", (e)=> logSystemError(e.message||"Unknown error"));
window.addEventListener("unhandledrejection", (e)=> logSystemError((e.reason&&e.reason.message)||"Unhandled promise rejection"));

function init(){
  loadState();
  if(!location.hash) location.hash = "/splash";
  render();
  initBackend();
  pullRemoteData();
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

</script>
</body>
</html>
